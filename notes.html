<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <title>StudyBuddy - Notes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <div class="app-header">

            <div class="brand-icon">
                📝
            </div>

            <h1>
                My Notes
            </h1>

            <p>
                Save and review your study notes.
            </p>

        </div>


        <!-- CREATE NOTE -->

        <div class="note">

            <h3>
                ✏️ Create a Note
            </h3>

            <input
                type="text"
                id="noteTitle"
                placeholder="Note title"
            >

            <textarea
                id="noteText"
                placeholder="Write your note here..."
            ></textarea>

            <button onclick="saveNote()">
                💾 Save Note
            </button>

        </div>


        <!-- SEARCH -->

        <div class="note">

            <h3>
                🔍 Find a Note
            </h3>

            <input
                type="text"
                id="noteSearch"
                placeholder="Search your notes..."
                oninput="searchNotes()"
            >

        </div>


        <!-- NOTES -->

        <div id="notesList"></div>


        <!-- BOTTOM NAVIGATION -->

        <nav class="bottom-nav">

            <button
                class="nav-item"
                onclick="goHome()"
            >
                🏠
                <span>Home</span>
            </button>

            <button
                class="nav-item active"
                onclick="openNotes()"
            >
                📝
                <span>Notes</span>
            </button>

            <button
                class="nav-item"
                onclick="openTasks()"
            >
                ✅
                <span>Tasks</span>
            </button>

            <button
                class="nav-item"
                onclick="openQuizzes()"
            >
                🧠
                <span>Quiz</span>
            </button>

            <button
                class="nav-item"
                onclick="openTimer()"
            >
                ⏱️
                <span>Timer</span>
            </button>

        </nav>


        <p class="app-footer">
            StudyBuddy • Study smarter 🎓
        </p>

    </div>


    <script src="app.js"></script>

</body>

</html>
