<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <title>StudyBuddy - Study Timer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <div class="app-header">

            <div class="brand-icon">
                ⏱️
            </div>

            <h1>
                Study Timer
            </h1>

            <p>
                Focus, study and take breaks
            </p>

        </div>


        <!-- TIMER -->

        <div class="note">

            <h3>
                🎯 Focus Session
            </h3>

            <div id="timer">
                25:00
            </div>

            <button onclick="startTimer()">
                ▶️ Start
            </button>

            <button onclick="pauseTimer()">
                ⏸️ Pause
            </button>

            <button onclick="resetTimer()">
                🔄 Reset
            </button>

        </div>


        <!-- BOTTOM NAVIGATION -->

        <nav class="bottom-nav">

            <button
                class="nav-item"
                onclick="goHome()"
            >
                🏠
                <span>Home</span>
            </button>

            <button
                class="nav-item"
                onclick="openNotes()"
            >
                📝
                <span>Notes</span>
            </button>

            <button
                class="nav-item"
                onclick="openTasks()"
            >
                ✅
                <span>Tasks</span>
            </button>

            <button
                class="nav-item"
                onclick="openQuizzes()"
            >
                🧠
                <span>Quiz</span>
            </button>

            <button
                class="nav-item active"
                onclick="openTimer()"
            >
                ⏱️
                <span>Timer</span>
            </button>

        </nav>


        <!-- FOOTER -->

        <p class="app-footer">
            StudyBuddy • Study smarter 🎓
        </p>

    </div>


    <script src="app.js"></script>

</body>

</html>
