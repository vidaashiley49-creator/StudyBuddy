<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <title>StudyBuddy - Tasks</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <div class="app-header">

            <div class="brand-icon">
                ✅
            </div>

            <h1>
                Tasks
            </h1>

            <p>
                Organize your study tasks
            </p>

        </div>


        <!-- ADD TASK -->

        <div class="note">

            <h3>
                ➕ Add a Task
            </h3>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>


        <!-- TASK LIST -->

        <div class="note">

            <h3>
                📋 My Tasks
            </h3>

            <ul id="taskList"></ul>

        </div>


        <!-- BOTTOM NAVIGATION -->

        <nav class="bottom-nav">

            <button
                class="nav-item"
                onclick="goHome()"
            >
                🏠
                <span>Home</span>
            </button>

            <button
                class="nav-item"
                onclick="openNotes()"
            >
                📝
                <span>Notes</span>
            </button>

            <button
                class="nav-item active"
                onclick="openTasks()"
            >
                ✅
                <span>Tasks</span>
            </button>

            <button
                class="nav-item"
                onclick="openQuizzes()"
            >
                🧠
                <span>Quiz</span>
            </button>

            <button
                class="nav-item"
                onclick="openTimer()"
            >
                ⏱️
                <span>Timer</span>
            </button>

        </nav>


        <!-- FOOTER -->

        <p class="app-footer">
            StudyBuddy • Study smarter 🎓
        </p>

    </div>


    <script src="app.js"></script>

</body>

</html>
