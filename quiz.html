<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBuddy - Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🧠 Study Quiz</h1>

        <p id="score">Score: 0</p>

        <h2 id="question"></h2>

        <div id="answers"></div>

        <p id="result"></p>

        <button id="nextButton" onclick="nextQuestion()">
            Next Question
        </button>

        <button onclick="goHome()">
            ← Back to Home
        </button>

    </div>

    <script src="app.js"></script>

</body>

</html>
